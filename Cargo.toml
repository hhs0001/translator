[package]
name = "translator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Desktop subtitle translator using LLM APIs"
default-run = "translator"

[[bin]]
name = "translator"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "net"] }
futures = "0.3"
regex = "1"
once_cell = "1"
thiserror = "2"
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
directories = "6"
